<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de resultados · WPC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Arial,sans-serif;color:#1b2a52;background:#f3f6fb}
.wrap{display:flex;min-height:100vh}
.izq{position:relative;flex:1 1 57%;background:linear-gradient(160deg,#1b2a52 0%,#2c5a96 100%);color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:48px 44px}
.logo{position:absolute;top:44px;left:44px;height:84px}
.rotulo{font-size:12px;letter-spacing:.18em;font-weight:600;color:#6db6f0;margin:0 0 14px}
.izq h1{font-size:30px;line-height:1.3;margin:0;max-width:720px;font-weight:700}
.arco{position:absolute;left:50%;bottom:-1120px;width:1270px;height:1270px;margin-left:-635px;border:1px solid rgba(255,255,255,.28);border-radius:50%;pointer-events:none}
.pie{position:absolute;left:44px;bottom:34px;font-size:12px;color:#c8d6ee}
.der{flex:1 1 43%;display:flex;align-items:center;padding:48px 8%}
.form{width:100%;max-width:380px}
.sup{font-size:11px;letter-spacing:.18em;font-weight:700;color:#2c5a96;margin:0 0 10px}
.form h2{font-size:26px;margin:0 0 10px;color:#0f1d3d}
.desc{font-size:13.5px;line-height:1.5;color:#4a5878;margin:0 0 30px;max-width:335px}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px;color:#0f1d3d}
input{width:100%;height:42px;border:1px solid #cfd8e8;border-radius:8px;padding:0 14px;font:inherit;font-size:14px;background:#fff;outline:none}
input:focus{border-color:#2c5a96;box-shadow:0 0 0 3px rgba(44,90,150,.15)}
button{margin-top:14px;width:100%;height:42px;border:0;border-radius:8px;font:inherit;font-weight:700;font-size:14px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#1b2a52,#2c5a96 55%,#5cb0e8)}
button:disabled{opacity:.6;cursor:wait}
.nota{font-size:12px;color:#33405e;margin-top:18px}
.estado{margin-top:10px;font-size:13px}.estado:empty{display:none}
.estado.err{color:#b42318}
.barra{height:6px;background:#dde5f2;border-radius:4px;overflow:hidden;margin-top:8px;display:none}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2c5a96,#5cb0e8);transition:width .15s}
@media (max-width:820px){
 .wrap{flex-direction:column}
 .izq{flex:none;padding:130px 24px 90px}
 .logo{top:24px;left:24px;height:64px}
 .izq h1{font-size:22px}
 .pie{left:24px;bottom:20px}
 .der{flex:none;padding:36px 24px 48px}
}

/* --- visor en vivo (añadido) --- */
body.visor .wrap{display:none}
#dashboard-frame{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#fff;display:block}
#dashboard-frame[hidden]{display:none}
#toast{position:fixed;left:14px;bottom:14px;z-index:20;max-width:min(520px,calc(100vw - 28px));padding:8px 12px;border-radius:8px;font-size:12.5px;background:#1b2a52;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.92}
#toast[data-state=error]{background:#b42318}
#toast[hidden]{display:none}
#lista[hidden]{display:none}
button.proy{margin-top:10px;text-align:left;padding:0 14px}
</style>
</head>
